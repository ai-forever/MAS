dataset_path: maximazzik/MAS
dataset_name: mas
dataset_kwargs: {}

test_split: test
task: "paper_arabic"
output_type: generate_until

# === Data mapping functions ===
doc_to_visual: !function utils.paper_arabic_to_visual
doc_to_text: !function utils.paper_arabic_doc_to_text
doc_to_target: "text"

# === Generation hyperparameters ===
generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

# === Metrics and processing ===
process_results: !function utils.paper_arabic_process_results

metric_list:
  - metric: paper_arabic_metrics
    aggregation: !function utils.paper_arabic_aggregate_metrics
    higher_is_better: false
    
lmms_eval_specific_kwargs:
  default:
    prompt: "Transcribe the Arabic manuscript line exactly as written. Preserve spelling, punctuation, dots, diacritics, and historical forms without normalization or correction. Output only the transcription."

metadata:
  - version: 0.1